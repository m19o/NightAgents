services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nightagents
      POSTGRES_USER: nightagents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - nightagents-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightagents -d nightagents"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - nightagents-elastic:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build: .
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      NIGHTAGENTS_API_HOST: 0.0.0.0
      NIGHTAGENTS_DATABASE_URL: postgresql+psycopg://nightagents:${POSTGRES_PASSWORD}@postgres:5432/nightagents
      NIGHTAGENTS_ELASTIC_URL: http://elasticsearch:9200
      NIGHTAGENTS_ELASTIC_VERIFY_TLS: "false"
      NIGHTAGENTS_INFRASTRUCTURE_MODE: database
      NIGHTAGENTS_HANDOFF_SIGNING_SECRET: ${NIGHTAGENTS_HANDOFF_SIGNING_SECRET:?set NIGHTAGENTS_HANDOFF_SIGNING_SECRET}
      NIGHTAGENTS_APPROVAL_SIGNING_SECRET: ${NIGHTAGENTS_APPROVAL_SIGNING_SECRET:?set NIGHTAGENTS_APPROVAL_SIGNING_SECRET}
      NIGHTAGENTS_EXECUTION_GRANT_SECRET: ${NIGHTAGENTS_EXECUTION_GRANT_SECRET:?set NIGHTAGENTS_EXECUTION_GRANT_SECRET}
      NIGHTAGENTS_ELASTIC_WEBHOOK_SECRET: ${NIGHTAGENTS_ELASTIC_WEBHOOK_SECRET:?set NIGHTAGENTS_ELASTIC_WEBHOOK_SECRET}
      NIGHTAGENTS_MCP_ENDPOINTS_JSON: ${NIGHTAGENTS_MCP_ENDPOINTS_JSON:?set NIGHTAGENTS_MCP_ENDPOINTS_JSON}
      NIGHTAGENTS_SAFETY_MCP_ENDPOINTS_JSON: ${NIGHTAGENTS_SAFETY_MCP_ENDPOINTS_JSON:?set NIGHTAGENTS_SAFETY_MCP_ENDPOINTS_JSON}
      NIGHTAGENTS_RESEARCH_MCP_ENDPOINTS_JSON: ${NIGHTAGENTS_RESEARCH_MCP_ENDPOINTS_JSON:?set NIGHTAGENTS_RESEARCH_MCP_ENDPOINTS_JSON}
      NIGHTAGENTS_MODEL_API_URL: ${NIGHTAGENTS_MODEL_API_URL:-}
      NIGHTAGENTS_MODEL_API_KEY: ${NIGHTAGENTS_MODEL_API_KEY:-}
      NIGHTAGENTS_MODEL_NAME: ${NIGHTAGENTS_MODEL_NAME:-local}
      NIGHTAGENTS_MODEL_ROLES_JSON: ${NIGHTAGENTS_MODEL_ROLES_JSON:-{}}
      NIGHTAGENTS_MODEL_REQUEST_TIMEOUT_SECONDS: ${NIGHTAGENTS_MODEL_REQUEST_TIMEOUT_SECONDS:-120}
      NIGHTAGENTS_SLACK_WEBHOOK_URL: ${NIGHTAGENTS_SLACK_WEBHOOK_URL:-}
      NIGHTAGENTS_SLACK_API_TOKEN: ${NIGHTAGENTS_SLACK_API_TOKEN:-}
      NIGHTAGENTS_SLACK_CHANNEL: ${NIGHTAGENTS_SLACK_CHANNEL:-}
      NIGHTAGENTS_SLACK_SIGNING_SECRET: ${NIGHTAGENTS_SLACK_SIGNING_SECRET:-}
      NIGHTAGENTS_SLACK_APP_TOKEN: ${NIGHTAGENTS_SLACK_APP_TOKEN:-}
      NIGHTAGENTS_DETECTION_INTERVAL_SECONDS: ${NIGHTAGENTS_DETECTION_INTERVAL_SECONDS:-0}
      NIGHTAGENTS_DETECTION_SOURCE: ${NIGHTAGENTS_DETECTION_SOURCE:-logs-nginx.access-*}
      NIGHTAGENTS_AUTO_INVESTIGATE: ${NIGHTAGENTS_AUTO_INVESTIGATE:-false}
      NIGHTAGENTS_THIRD_PARTY_MONITOR_INTERVAL_SECONDS: ${NIGHTAGENTS_THIRD_PARTY_MONITOR_INTERVAL_SECONDS:-0}
      NIGHTAGENTS_THIRD_PARTY_FEEDS_JSON: ${NIGHTAGENTS_THIRD_PARTY_FEEDS_JSON:-{}}
      NIGHTAGENTS_THIRD_PARTY_FEEDS_VERIFY_TLS: ${NIGHTAGENTS_THIRD_PARTY_FEEDS_VERIFY_TLS:-true}
      NIGHTAGENTS_HANDOFF_TTL_MINUTES: ${NIGHTAGENTS_HANDOFF_TTL_MINUTES:-15}
    depends_on:
      migrate:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      NIGHTAGENTS_DATABASE_URL: postgresql+psycopg://nightagents:${POSTGRES_PASSWORD}@postgres:5432/nightagents
    depends_on:
      postgres:
        condition: service_healthy

  elastic-mcp:
    build: .
    command: ["nightagents-elastic-mcp"]
    environment:
      NIGHTAGENTS_ELASTIC_URL: http://elasticsearch:9200
      NIGHTAGENTS_ELASTIC_VERIFY_TLS: "false"
      NIGHTAGENTS_HANDOFF_SIGNING_SECRET: ${NIGHTAGENTS_HANDOFF_SIGNING_SECRET:?set NIGHTAGENTS_HANDOFF_SIGNING_SECRET}
      NIGHTAGENTS_MCP_TOKENS_JSON: ${NIGHTAGENTS_MCP_TOKENS_JSON:?set NIGHTAGENTS_MCP_TOKENS_JSON}
      NIGHTAGENTS_MCP_HOST: 0.0.0.0
      NIGHTAGENTS_MCP_PORT: 8101
    depends_on:
      elasticsearch:
        condition: service_healthy

  mythic-mcp:
    build: .
    command: ["nightagents-mythic-mcp"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NIGHTAGENTS_MYTHIC_URL: ${NIGHTAGENTS_MYTHIC_URL:?set NIGHTAGENTS_MYTHIC_URL}
      NIGHTAGENTS_MYTHIC_API_KEY: ${NIGHTAGENTS_MYTHIC_API_KEY:?set NIGHTAGENTS_MYTHIC_API_KEY}
      NIGHTAGENTS_MYTHIC_VERIFY_TLS: ${NIGHTAGENTS_MYTHIC_VERIFY_TLS:-true}
      NIGHTAGENTS_EXECUTION_GRANT_SECRET: ${NIGHTAGENTS_EXECUTION_GRANT_SECRET:?set NIGHTAGENTS_EXECUTION_GRANT_SECRET}
      NIGHTAGENTS_MCP_TOKENS_JSON: ${NIGHTAGENTS_MCP_TOKENS_JSON:?set NIGHTAGENTS_MCP_TOKENS_JSON}
      NIGHTAGENTS_MCP_HOST: 0.0.0.0
      NIGHTAGENTS_MCP_PORT: 8102

  memory-mcp:
    build: .
    command: ["nightagents-memory-mcp"]
    environment:
      NIGHTAGENTS_DATABASE_URL: postgresql+psycopg://nightagents:${POSTGRES_PASSWORD}@postgres:5432/nightagents
      NIGHTAGENTS_MCP_TOKENS_JSON: ${NIGHTAGENTS_MCP_TOKENS_JSON:?set NIGHTAGENTS_MCP_TOKENS_JSON}
      NIGHTAGENTS_MCP_HOST: 0.0.0.0
      NIGHTAGENTS_MCP_PORT: 8103
    depends_on:
      migrate:
        condition: service_completed_successfully

  infrastructure-mcp:
    build: .
    command: ["nightagents-infrastructure-mcp"]
    environment:
      NIGHTAGENTS_DATABASE_URL: postgresql+psycopg://nightagents:${POSTGRES_PASSWORD}@postgres:5432/nightagents
      NIGHTAGENTS_INFRASTRUCTURE_MODE: ${NIGHTAGENTS_INFRASTRUCTURE_MODE:-database}
      NIGHTAGENTS_ELASTIC_URL: http://elasticsearch:9200
      NIGHTAGENTS_ELASTIC_VERIFY_TLS: "false"
      NIGHTAGENTS_LAB_VICTIM_CONTAINER: ${NIGHTAGENTS_LAB_VICTIM_CONTAINER:-}
      NIGHTAGENTS_LAB_HOSTNAME: ${NIGHTAGENTS_LAB_HOSTNAME:-redirector-pass.demo}
      NIGHTAGENTS_LAB_REDIRECTOR_MAP_JSON: ${NIGHTAGENTS_LAB_REDIRECTOR_MAP_JSON:-{}}
      NIGHTAGENTS_LAB_DATA_STREAM: ${NIGHTAGENTS_LAB_DATA_STREAM:-logs-redirector-demo}
      NIGHTAGENTS_EXECUTION_GRANT_SECRET: ${NIGHTAGENTS_EXECUTION_GRANT_SECRET:?set NIGHTAGENTS_EXECUTION_GRANT_SECRET}
      NIGHTAGENTS_MCP_TOKENS_JSON: ${NIGHTAGENTS_MCP_TOKENS_JSON:?set NIGHTAGENTS_MCP_TOKENS_JSON}
      NIGHTAGENTS_MCP_HOST: 0.0.0.0
      NIGHTAGENTS_MCP_PORT: 8104
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully

  third-party-mcp:
    build: .
    command: ["nightagents-third-party-mcp"]
    environment:
      NIGHTAGENTS_MCP_TOKENS_JSON: ${NIGHTAGENTS_MCP_TOKENS_JSON:?set NIGHTAGENTS_MCP_TOKENS_JSON}
      NIGHTAGENTS_MCP_HOST: 0.0.0.0
      NIGHTAGENTS_MCP_PORT: 8105

  worker:
    build: .
    command: ["nightagents-worker"]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      NIGHTAGENTS_DATABASE_URL: postgresql+psycopg://nightagents:${POSTGRES_PASSWORD}@postgres:5432/nightagents
      NIGHTAGENTS_OUTBOX_WEBHOOK_URL: ${NIGHTAGENTS_OUTBOX_WEBHOOK_URL:?set NIGHTAGENTS_OUTBOX_WEBHOOK_URL}
      NIGHTAGENTS_OUTBOX_WEBHOOK_SECRET: ${NIGHTAGENTS_OUTBOX_WEBHOOK_SECRET:?set NIGHTAGENTS_OUTBOX_WEBHOOK_SECRET}
      NIGHTAGENTS_HANDOFF_SIGNING_SECRET: ${NIGHTAGENTS_HANDOFF_SIGNING_SECRET:?set NIGHTAGENTS_HANDOFF_SIGNING_SECRET}
      NIGHTAGENTS_APPROVAL_SIGNING_SECRET: ${NIGHTAGENTS_APPROVAL_SIGNING_SECRET:?set NIGHTAGENTS_APPROVAL_SIGNING_SECRET}
      NIGHTAGENTS_MCP_ENDPOINTS_JSON: ${NIGHTAGENTS_MCP_ENDPOINTS_JSON:?set NIGHTAGENTS_MCP_ENDPOINTS_JSON}
      NIGHTAGENTS_RESEARCH_MCP_ENDPOINTS_JSON: ${NIGHTAGENTS_RESEARCH_MCP_ENDPOINTS_JSON:?set NIGHTAGENTS_RESEARCH_MCP_ENDPOINTS_JSON}
      NIGHTAGENTS_MODEL_API_URL: ${NIGHTAGENTS_MODEL_API_URL:-}
      NIGHTAGENTS_MODEL_API_KEY: ${NIGHTAGENTS_MODEL_API_KEY:-}
      NIGHTAGENTS_MODEL_NAME: ${NIGHTAGENTS_MODEL_NAME:-local}
      NIGHTAGENTS_MODEL_ROLES_JSON: ${NIGHTAGENTS_MODEL_ROLES_JSON:-{}}
      NIGHTAGENTS_MODEL_REQUEST_TIMEOUT_SECONDS: ${NIGHTAGENTS_MODEL_REQUEST_TIMEOUT_SECONDS:-120}
      NIGHTAGENTS_SLACK_WEBHOOK_URL: ${NIGHTAGENTS_SLACK_WEBHOOK_URL:-}
      NIGHTAGENTS_SLACK_API_TOKEN: ${NIGHTAGENTS_SLACK_API_TOKEN:-}
      NIGHTAGENTS_SLACK_CHANNEL: ${NIGHTAGENTS_SLACK_CHANNEL:-}
      NIGHTAGENTS_SLACK_SIGNING_SECRET: ${NIGHTAGENTS_SLACK_SIGNING_SECRET:-}
      NIGHTAGENTS_SLACK_APP_TOKEN: ${NIGHTAGENTS_SLACK_APP_TOKEN:-}
      NIGHTAGENTS_DETECTION_INTERVAL_SECONDS: ${NIGHTAGENTS_DETECTION_INTERVAL_SECONDS:-0}
      NIGHTAGENTS_DETECTION_SOURCE: ${NIGHTAGENTS_DETECTION_SOURCE:-logs-nginx.access-*}
      NIGHTAGENTS_AUTO_INVESTIGATE: ${NIGHTAGENTS_AUTO_INVESTIGATE:-false}
      NIGHTAGENTS_THIRD_PARTY_MONITOR_INTERVAL_SECONDS: ${NIGHTAGENTS_THIRD_PARTY_MONITOR_INTERVAL_SECONDS:-0}
      NIGHTAGENTS_THIRD_PARTY_FEEDS_JSON: ${NIGHTAGENTS_THIRD_PARTY_FEEDS_JSON:-{}}
      NIGHTAGENTS_THIRD_PARTY_FEEDS_VERIFY_TLS: ${NIGHTAGENTS_THIRD_PARTY_FEEDS_VERIFY_TLS:-true}
      NIGHTAGENTS_HANDOFF_TTL_MINUTES: ${NIGHTAGENTS_HANDOFF_TTL_MINUTES:-15}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  nightagents-postgres:
  nightagents-elastic:
