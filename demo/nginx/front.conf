# Technique 3: domain-fronting style vhost hiding.
# One IP serves two logical sites. The visible site (weather-front.demo)
# returns a benign page to everyone. Requests carrying the hidden Host
# header (cdn-metrics.demo) are silently proxied to Mythic. Teaching point:
# the domain you see in the redirector's certificate/SNI is not the domain
# the implant actually talks to.
server {
    listen 8080;
    server_name weather-front.demo;

    access_log /redirector-logs/access.log json_combined;

    location / {
        root /usr/share/nginx/html;
        index decoy.html;
    }
}

server {
    listen 8080;
    server_name cdn-metrics.demo;

    access_log /redirector-logs/access.log json_combined;

    location / {
        proxy_pass http://host.docker.internal:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
