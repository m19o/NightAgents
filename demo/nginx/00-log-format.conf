map_hash_bucket_size 128;

log_format json_combined escape=json
    '{"@timestamp":"$time_iso8601","host":{"name":"$hostname"},'
    '"source":{"ip":"$remote_addr"},'
    '"http":{"request":{"method":"$request_method"},'
    '"response":{"status_code":$status}},'
    '"url":{"path":"$uri","original":"$request_uri"},'
    '"http_request_host":"$host",'
    '"user_agent":{"original":"$http_user_agent"},'
    '"redirector":"$server_name",'
    '"upstream":{"address":"$upstream_addr","response_time":$upstream_response_time}}';
