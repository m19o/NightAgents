# Technique 4: A/B path-split redirector.
# One domain serves real content and C2 traffic side by side: /static/* is
# a harmless download site, while the implant's URIs are proxied to Mythic.
# Teaching point: blending C2 into a site that has legitimate-looking
# content defeats reputation-based blocking and casual review.
server {
    listen 8080;
    server_name _;

    access_log /redirector-logs/access.log json_combined;

    location /static/ {
        root /usr/share/nginx/html;
        autoindex on;
    }

    location /index {
        proxy_pass http://host.docker.internal:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /data {
        proxy_pass http://host.docker.internal:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
