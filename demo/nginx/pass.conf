# Technique 1: plain pass-through redirector.
# Every request is forwarded to the Mythic http C2 profile unchanged.
# Teaching point: the simplest redirection layer - the victim never learns the
# real C2 address, and the C2 never sees the victim's real IP.
server {
    listen 8080;
    server_name _;

    access_log /redirector-logs/access.log json_combined;

    location / {
        proxy_pass http://host.docker.internal:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
